
name: Build IPA (PATCHED lois)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "URL to a decrypted Spotify IPA (optional)"
        default: ""
        required: false
        type: string
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          python3 -m pip install --upgrade --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            SUFFIX=macos-amd64
          else
            SUFFIX=macos-arm64
          fi

          sudo curl -fsSL \
            "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
            -o /usr/local/bin/ipapatch

          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build .deb (rootless)
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)

          [ -n "$DEB_PATH" ] || {
            echo "::error::deb not produced"
            exit 1
          }

          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> "$GITHUB_ENV"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # IPA build: only when ipa_url is provided

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail

          wget "$IPA_URL" --no-verbose -O "$GITHUB_WORKSPACE/spotify.ipa"

          FILE_TYPE=$(file --mime-type -b "$GITHUB_WORKSPACE/spotify.ipa")

          if [[ "$FILE_TYPE" != "application/x-ios-app" &&
                "$FILE_TYPE" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $FILE_TYPE"
            exit 1
          fi

          unzip -tq "$GITHUB_WORKSPACE/spotify.ipa"

      - name: Build zxPluginsInject.dylib
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: Fetch OpeninSafariSpotify extension (.appex)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail

          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"

          git clone --depth 1 \
            https://github.com/BillyCurtis/OpenSpotifySafariExtension.git \
            "$EXT_DIR"

          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"

          [ -d "$EXT_SRC" ] || {
            echo "::error::OpenSpotifySafariExtension.appex not found"
            exit 1
          }

          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> "$GITHUB_ENV"

      - name: Inject deb + framework into IPA (cyan)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail

          mkdir -p Outputs/IPAS

          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"

          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" \
            -name 'EeveeSpotify.dylib' -print -quit)

          BUNDLE_SRC=$(find "$DEB_EXTRACT" \
            -type d -name 'EeveeSpotify.bundle' -print -quit)

          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" \
            -type d -name 'EeveeSwiftProtobuf.framework' -print -quit)

          [ -n "$DYLIB_SRC" ] || {
            echo "::error::EeveeSpotify.dylib not found"
            exit 1
          }

          SPOT_VERSION=$(
            unzip -p "$GITHUB_WORKSPACE/spotify.ipa" \
              'Payload/Spotify.app/Info.plist' |
              plutil -extract CFBundleShortVersionString raw - \
                2>/dev/null || echo "unknown"
          )

          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")

          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ] && INJECT+=("$BUNDLE_SRC")

          # -du strips Watch/appex components.
          # -m 15.0 sets the minimum OS version.
          # -c 9 enables maximum compression.
          cyan -i "$GITHUB_WORKSPACE/spotify.ipa" \
            -o "$OUT" \
            -f "${INJECT[@]}" \
            -c 9 -m 15.0 -du

          [ -f "$OUT" ] || {
            echo "::error::IPA output was not created"
            exit 1
          }

          echo "OUT_IPA=$GITHUB_WORKSPACE/$OUT" >> "$GITHUB_ENV"

      - name: LC-inject zxPluginsInject (ipapatch)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail

          ipapatch \
            --input "$OUT_IPA" \
            --inplace \
            --noconfirm \
            --dylib "$GITHUB_WORKSPACE/packages/zxPluginsInject.dylib"

      - name: Inject OpeninSafariSpotify extension into IPA PlugIns
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/spotify-safari-inject"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$OUT_IPA" -d "$WORK"

          APP="$WORK/Payload/Spotify.app"
          PLUGINS="$APP/PlugIns"

          [ -f "$APP/Info.plist" ] || {
            echo "::error::Spotify.app/Info.plist not found"
            exit 1
          }

          mkdir -p "$PLUGINS"

          rm -rf "$PLUGINS/OpenSpotifySafariExtension.appex"

          cp -R "$OPENSPOTIFY_APPEX" \
            "$PLUGINS/OpenSpotifySafariExtension.appex"

          # Recreate the archive to avoid retaining stale entries.
          rm -f "$OUT_IPA"

          (
            cd "$WORK"
            zip -qry "$OUT_IPA" Payload
          )

          unzip -tq "$OUT_IPA"
          rm -rf "$WORK"

      - name: Stage alternate app icons
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail

          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Final IPA cleanup (remove embedded Watch app)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail

          IPA="$OUT_IPA"
          WORK="$RUNNER_TEMP/spotify-final-clean"
          APP="$WORK/Payload/Spotify.app"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q "$IPA" -d "$WORK"

          [ -f "$APP/Info.plist" ] || {
            echo "::error::Spotify.app/Info.plist not found"
            exit 1
          }

          MAIN_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          )

          echo "Main app bundle ID: $MAIN_ID"

          # Remove standard Watch app locations.
          rm -rf "$APP/Watch"
          rm -rf "$APP/com.apple.WatchPlaceholder"

          # Remove nested app bundles declaring a Watch companion ID.
          while IFS= read -r -d '' BUNDLE; do
            PLIST="$BUNDLE/Info.plist"

            if [ -f "$PLIST" ] &&
               /usr/libexec/PlistBuddy \
                 -c 'Print :WKCompanionAppBundleIdentifier' \
                 "$PLIST" >/dev/null 2>&1; then
              echo "Removing embedded Watch app: $BUNDLE"
              rm -rf "$BUNDLE"
            fi
          done < <(
            find "$APP" -mindepth 2 -type d -name '*.app' -print0
          )

          # Rebuild the IPA from the cleaned Payload.
          rm -f "$IPA"

          (
            cd "$WORK"
            zip -qry "$IPA" Payload
          )

          unzip -tq "$IPA"
          rm -rf "$WORK"

          echo "Final IPA ready: $IPA"

      # Optional standard GitHub Actions artifact.

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
          retention-days: 30

      # Optional filebin upload.

      - name: Upload IPA to filebin.net
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'filebin' || inputs.upload_method == 'both') }}
        run: |
          set -euo pipefail

          BIN="eevee-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FILENAME=$(basename "$OUT_IPA")

          curl -fsS -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${OUT_IPA}" \
            "https://filebin.net/${BIN}/${FILENAME}" >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"

          echo "Uploaded to: ${DOWNLOAD_URL}"

          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Download promptly; filebin bins may expire._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish a downloadable IPA in the Mis-IPAs repository.

      - name: Publish IPA to Mis-IPAs Release
        if: ${{ inputs.ipa_url != '' }}
        env:
          GH_TOKEN: ${{ secrets.MIS_IPAS_TOKEN }}
        run: |
          set -euo pipefail

          REPO="luiss5523/Mis-IPAs"
          TAG="spotify-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          FILENAME=$(basename "$OUT_IPA")

          [ -f "$OUT_IPA" ] || {
            echo "::error::IPA file not found: $OUT_IPA"
            exit 1
          }

          # Verify that the token can access the destination repository.
          gh repo view "$REPO" >/dev/null

          # Create a new release and attach the IPA.
          gh release create "$TAG" "$OUT_IPA" \
            --repo "$REPO" \
            --title "Spotify IPA - Build ${GITHUB_RUN_NUMBER}" \
            --notes "IPA generado automáticamente mediante GitHub Actions."

          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"

          {
            echo "### 📦 IPA publicado en Mis-IPAs"
            echo "- **Archivo:** ${FILENAME}"
            echo "- **Release:** ${TAG}"
            echo "- **Descarga:** ${DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "IPA published: ${DOWNLOAD_URL}"
